name: run CodeQL Analysis
on:
  workflow_dispatch:
  pull_request:
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CodeQL CLI
        run: |
          curl -L -o codeql.zip https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip
          unzip codeql.zip -d $HOME/codeql
          echo "$HOME/codeql" >> $GITHUB_PATH
          codeql --version

      - name: Create CodeQL database with build tracing
        run: codeql database create db-bazel --language=cpp --command='bazel build //examples:example'

      - name: Perform CodeQL Analysis
        run: codeql database analyze db-bazel cpp-security-and-quality.qls --format=sarifv2.1.0 --output=results.

        # Upload results to GitHub Code Scanning
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif